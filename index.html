<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">Score</span>
          <span id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Record</span>
          <span id="best">0</span>
        </div>
      </div>
    </header>

    <div class="controls">
      <p class="hint">Fusionne les tuiles pour atteindre <strong>2048</strong> !<br>
      Flèches / ZQSD / glissement tactile.</p>
      <button id="new-game">Nouvelle partie</button>
    </div>

    <div class="board-wrapper">
      <div id="board" class="board"></div>
      <div id="overlay" class="overlay hidden">
        <p id="overlay-text"></p>
        <button id="overlay-btn">Rejouer</button>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
